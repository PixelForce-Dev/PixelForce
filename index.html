  <link rel="icon" type="image/png" sizes="32x32" href="images/Iconos/LogoGris.png">

  <!-- slider stylesheet -->
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.1.3/assets/owl.carousel.min.css" />

  <!-- bootstrap core css -->
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />

  <!-- fonts style -->
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,700|Roboto:400,700&display=swap" rel="stylesheet">

<body>
  <div class="hero_area">
    <!-- header section strats -->
    <header class="header_section">
      <div id="header-placeholder"></div>
    </header>
    <!-- end header section -->
    <!-- slider section -->
    <section class=" slider_section position-relative">

      <div class="slider_bg-container">

      </div>
      <div class="slider-container">

        <div class="detail-box">
          <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
            <span class="sr-only">Previous</span>
          </a>
          <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
            <span class="sr-only">Next</span>
          </a>
          <h1>
            Tu lo piensas <br>
            NOSOTROS <br>
            lo hacemos realidad
          </h1>
          <p>
            Nos especializamos en el desarrollo de videojuegos y páginas web, la venta de productos innovadores y la creación de contenido, ofreciendo experiencias digitales únicas que combinan creatividad y tecnología.
          </p>
          <div>
            <a href="servicios.html" class="slider-link">
              Conoce nuestros servicios
            </a>
          </div>
        </div>
        <div class="img-box">
          <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="images/Imagenes/FondoInicioPixelApp.png" alt="">
              </div>
              <div class="carousel-item">

                <img src="images/Imagenes/FondoInicioPixelWare.png" alt="">

              <div class="carousel-item">

              <div class="carousel-item">
                <img src="images/Imagenes/FondoInicioPixelSocial.png" alt="">
              </div>
            </div>

          </div>

        </div>

    <!-- end slider section -->
     <!-- info section -->
    <div id="footer-placeholder"></div>
  <!-- end info_section -->
  </div>
  <script type="text/javascript" src="js/jquery-3.4.1.min.js"></script>
  <script type="text/javascript" src="js/bootstrap.js"></script>
  <script>
    fetch('pages/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
      })
      .catch(error => console.error('Error loading header:', error));
  </script>
  <script>
    fetch('pages/footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      })
      .catch(error => console.error('Error loading footer:', error));
  </script>
